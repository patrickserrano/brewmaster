name: ci
on:
  push: { branches: [main] }
  pull_request:
jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "1.22" }
      - run: go vet ./...
      - run: go test ./...
      # GitHub macOS runners ship with Homebrew but few/no casks installed.
      # `brew info --json=v2 --installed` still succeeds with an empty cask
      # list, and the integration test only asserts that whatever comes back
      # parses cleanly — so this is a real (blocking) check that brew's JSON
      # shape hasn't drifted, even on a cask-free runner.
      - run: go test -tags integration ./internal/brew/
